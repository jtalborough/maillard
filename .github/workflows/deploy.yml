name: Build Maillard Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: "maillard-build-${{ github.ref }}", cancel-in-progress: false }

permissions:
  contents: write
  packages: write

jobs:
  docker:
    # Only the canonical repo publishes images; forks and PRs never run this.
    if: github.repository == 'jtalborough/maillard' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Compute version
        id: version
        run: |
          DATE_TAG=$(date -u +'%Y.%m.%d')
          # Count existing tags for today to generate build number
          git fetch --tags --quiet
          BUILD_NUM=$(git tag -l "${DATE_TAG}.*" | wc -l | tr -d ' ')
          printf 'app_version=%s\ngit_sha=%s\nbuild_date=%s\n' \
            "${DATE_TAG}.${BUILD_NUM}" "${GITHUB_SHA::7}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Tag build
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.version.outputs.app_version }}"
          git push origin "${{ steps.version.outputs.app_version }}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_SHA=${{ steps.version.outputs.git_sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record pushed image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Image built from %s\n\n%s@%s\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
